<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <title>Recovery Habit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="Denné predsavzatia, návyky, pripomienky a prehľad pokroku. Dáta ostávajú v tvojom zariadení." />
  <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1f1d" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Recovery" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />

  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="install-banner" class="install-banner" hidden>
    <img src="icons/icon-96.png" alt="" width="40" height="40" />
    <div class="install-text">
      <strong>Pridaj si Recovery Habit na plochu</strong>
      <span id="install-hint">Klepni na <b>Zdieľať</b> <span class="ios-share">⎋</span> a potom na <b>Pridať na plochu</b>.</span>
    </div>
    <button id="install-close" class="icon-btn" aria-label="Zavrieť">✕</button>
  </div>

  <main id="app" class="app" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Domov</span>
    </a>
    <a href="#/calendar" data-tab="calendar" class="tab">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Kalendár</span>
    </a>
    <a href="#/add" data-tab="add" class="tab tab-add" aria-label="Pridať predsavzatie">
      <span class="add-circle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span>Pridať</span>
    </a>
    <a href="#/stats" data-tab="stats" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Štatistiky</span>
    </a>
    <a href="#/settings" data-tab="settings" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Nastavenia</span>
    </a>
  </nav>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script src="app.js"></script>
</body>
</html>
